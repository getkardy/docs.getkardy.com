<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Offer to shop to membership</title><desc id="desc">Find an offer, view its merchant and locations, then open the join page. Sample listings are previews; joining depends on availability.</desc><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#DFDDEB"/></pattern><linearGradient id="green" x2="1" y2="1"><stop stop-color="#E4F2CE"/><stop offset="1" stop-color="#A9D579"/></linearGradient></defs><rect width="800" height="340" rx="24" fill="#F8F8FC"/><rect width="800" height="340" rx="24" fill="url(#dots)"/><g font-family="Inter,Arial,sans-serif" fill="#171A18"><g stroke="#DFDDE7" fill="white"><rect x="28" y="36" width="228" height="264" rx="22"/><rect x="286" y="36" width="228" height="264" rx="22"/><rect x="544" y="36" width="228" height="264" rx="22"/></g><rect x="40" y="48" width="204" height="125" rx="15" fill="url(#green)"/><text x="57" y="78" font-size="17" font-weight="600">Sunday Coffee</text><text x="57" y="140" font-size="25" font-weight="600">Coffee, on us.</text><text x="48" y="207" font-size="19" font-weight="600">Find an offer</text><text x="48" y="239" font-size="15" fill="#595866">Search or browse rewards.</text><text x="48" y="274" font-size="16" fill="#5932D2">View merchant →</text><rect x="300" y="49" width="200" height="48" rx="12" fill="#ECE5FF"/><text x="308" y="134" font-size="23" font-weight="600">Sunday Coffee</text><text x="308" y="166" font-size="16" fill="#595866">Rewards · Locations · Terms</text><text x="308" y="207" font-size="19" font-weight="600">Explore the shop</text><text x="308" y="239" font-size="15" fill="#595866">Check the programme.</text><text x="308" y="274" font-size="16" fill="#5932D2">Join membership →</text><rect x="565" y="62" width="186" height="91" rx="15" fill="#6B42FF"/><text x="580" y="97" font-size="18" fill="white" font-weight="600">Your membership</text><g fill="white"><circle cx="588" cy="128" r="6"/><circle cx="612" cy="128" r="6"/><circle cx="636" cy="128" r="6"/></g><text x="565" y="207" font-size="19" font-weight="600">Check availability</text><text x="565" y="239" font-size="15" fill="#595866">Sign in and join when live.</text><text x="565" y="274" font-size="16" fill="#5932D2">Open your wallet →</text></g></svg>
