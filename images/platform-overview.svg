<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Your business and your customers, connected by Kardy</title>
<desc id="desc">The merchant portal manages the programme. The customer wallet holds memberships and progress. Both connect to Kardy shared services for memberships, stamps and rewards. Each business keeps its own programme.</desc>
<rect width="720" height="520" rx="24" fill="#FFF0EE"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#42001C">
<text x="32" y="46" font-size="22" font-weight="700">Two sides. One connected programme.</text>
<text x="32" y="74" font-size="14" fill="#795565">Your team runs it. Your customers keep it close.</text>
<rect x="32" y="102" width="316" height="154" rx="18" fill="white" stroke="#E7D6DC"/>
<rect x="372" y="102" width="316" height="154" rx="18" fill="white" stroke="#E7D6DC"/>
<rect x="52" y="122" width="40" height="40" rx="12" fill="#FF90C1"/>
<g fill="none" stroke="#42001C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M61 138h22l-3-8H64l-3 8Zm2 0v15h18v-15M68 153v-8h8v8"/>
</g>
<text x="106" y="138" font-size="12" fill="#795565">FOR YOUR TEAM</text>
<text x="106" y="158" font-size="20" font-weight="700">Merchant portal</text>
<text x="52" y="195" font-size="15">Manage members and rewards.</text>
<text x="52" y="220" font-size="15">Record visits and confirm claims.</text>
<rect x="392" y="122" width="40" height="40" rx="12" fill="#AF79F3"/>
<g fill="none" stroke="#42001C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect x="401" y="131" width="23" height="22" rx="4"/>
<path d="M401 137h23m-7 5h7v7h-7z"/>
</g>
<text x="446" y="138" font-size="12" fill="#795565">FOR YOUR CUSTOMERS</text>
<text x="446" y="158" font-size="20" font-weight="700">Customer wallet</text>
<text x="392" y="195" font-size="15">Keep memberships together.</text>
<text x="392" y="220" font-size="15">Show a QR and check progress.</text>
<g fill="none" stroke="#AC8093" stroke-width="1.5" stroke-linecap="round">
<path d="M190 256v24q0 12 12 12h316q12 0 12-12v-24M360 292v30"/>
<circle cx="190" cy="256" r="3" fill="#FFF0EE"/><circle cx="530" cy="256" r="3" fill="#FFF0EE"/>
</g>
<rect x="80" y="322" width="560" height="116" rx="20" fill="#42001C"/>
<text x="360" y="354" text-anchor="middle" font-size="21" font-weight="700" fill="#FFF0EE">Connected by Kardy</text>
<text x="360" y="380" text-anchor="middle" font-size="14" fill="#FFF0EE">Shared services keep access and activity in sync.</text>
<g font-size="13" font-weight="600" text-anchor="middle">
<rect x="121" y="397" width="152" height="26" rx="13" fill="#FF90C1"/>
<text x="197" y="415">Memberships</text>
<rect x="285" y="397" width="152" height="26" rx="13" fill="#AF79F3"/>
<text x="361" y="415">Stamps</text>
<rect x="449" y="397" width="152" height="26" rx="13" fill="#FFF0EE"/>
<text x="525" y="415">Rewards</text>
</g>
<text x="360" y="475" text-anchor="middle" font-size="14" fill="#795565">Each business keeps its own programme and member records.</text>
<text x="360" y="499" text-anchor="middle" font-size="11" fill="#795565">How Kardy fits together · Illustrative overview</text>
</g>
