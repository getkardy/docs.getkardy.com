<title id="title">Connect Kardy to your agent in three steps</title>
<desc id="desc">Illustrative setup: add the Kardy MCP connection in Claude, Codex or another compatible agent. Sign in as an owner, choose one merchant and read-only permissions, and approve access. Return to your conversation to ask about rewards. Sample screens and fictional data, not a live connection.</desc>
