<text x="322" y="43">02</text><text x="350" y="43">Approve access</text>
<text x="612" y="43">03</text><text x="640" y="43">Start a conversation</text>
</g>
<g font-size="11" fill="#71717B"><text x="32" y="66">In your preferred MCP client</text><text x="322" y="66">One brand. You choose what to share.</text><text x="612" y="66">Your workspace, in the conversation.</text></g>
