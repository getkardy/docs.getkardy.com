<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 728" role="img" aria-labelledby="title desc">
<title id="title">Kardy OAuth approval screen preview</title><desc id="desc">Example client Codex requests read-only access to Sunday Coffee. The Owner reviews the callback address, chooses a merchant and permissions, and can cancel or allow access.</desc>
<rect width="400" height="728" rx="22" fill="#f7f7fa"/>
<g font-family="Arial, sans-serif" fill="#171a18">
<text x="30" y="47" font-size="27" font-weight="700" letter-spacing="-1.5">kardy</text><text x="370" y="42" text-anchor="end" font-size="10" fill="#797382">ILLUSTRATIVE PREVIEW</text>
<rect x="18" y="68" width="364" height="640" rx="23" fill="#fff" stroke="#e1dfe8"/>
<rect x="40" y="91" width="44" height="44" rx="13" fill="#f0eaff"/><path d="M62 101l11 5v9c0 7-11 12-11 12s-11-5-11-12v-9z M57 113l4 4 7-8" fill="none" stroke="#6b43ff" stroke-width="1.8" stroke-linejoin="round"/>
<text x="40" y="171" font-size="25" font-weight="600">Connect Codex?</text>
<g font-size="13" fill="#666271"><text x="40" y="197">Read-only access to one merchant.</text><text x="40" y="217">Customer records, stamps, billing and team</text><text x="40" y="237">settings are never shared.</text></g>
<rect x="40" y="258" width="320" height="107" rx="13" fill="#f7f7f9"/>
<g font-size="11" fill="#706a7a"><text x="54" y="279">Client-provided name · identity not verified</text><text x="54" y="304" font-family="monospace" fill="#302c38">Returns to http://127.0.0.1:47891/callback</text><text x="54" y="331">Approve only if you started this connection</text><text x="54" y="347">and recognise this address.</text></g>
<text x="40" y="396" font-size="13" font-weight="600">Choose one merchant</text>
<rect x="40" y="409" width="320" height="42" rx="8" fill="#fff" stroke="#d7d4df"/><text x="54" y="436" font-size="14">Sunday Coffee</text><path d="M334 427l5 5 5-5" stroke="#777" fill="none" stroke-width="1.5"/>
<text x="40" y="483" font-size="13" font-weight="600">Allow this client to read</text>
<g fill="#6b43ff"><rect x="40" y="501" width="15" height="15" rx="3"/><rect x="40" y="532" width="15" height="15" rx="3"/><rect x="40" y="563" width="15" height="15" rx="3"/></g>
<path d="M44 508l3 3 5-6 M44 539l3 3 5-6 M44 570l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5"/>
<g font-size="13"><text x="66" y="513">Programme name and tagline</text><text x="66" y="544">Active rewards and stamp goals</text><text x="66" y="575">Active outlets and business addresses</text></g>
<g font-size="11" fill="#777180"><text x="40" y="608">Connection lasts up to 30 days. Disconnect any time</text><text x="40" y="625">from Settings → Agent connections.</text></g>
<rect x="40" y="649" width="77" height="39" rx="8" fill="#fff" stroke="#d7d4df"/><text x="78" y="674" text-anchor="middle" font-size="12">Cancel</text><rect x="128" y="649" width="232" height="39" rx="8" fill="#171a18"/><text x="244" y="674" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Allow read-only access</text>
</g></svg>
