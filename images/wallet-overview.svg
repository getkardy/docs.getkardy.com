<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Your brand. One Kardy wallet.</title>
  <desc id="desc">Illustrative Sunday Coffee and Good Company cards, together in the Kardy browser wallet. Sunday Coffee has four of ten stamps; Good Company has two of eight. Each business keeps separate rewards and progress. Apple Wallet and Google Wallet native passes are supported when issuance is enabled. Not a live account or an installed native wallet pass.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="900" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#F6F5FA"/><stop offset="1" stop-color="#F8FAF6"/></linearGradient>
    <linearGradient id="lavender" x1="20" y1="0" x2="365" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#F0EAFF"/><stop offset=".58" stop-color="#DED1FF"/><stop offset="1" stop-color="#E8DDF2"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="340" y2="210" gradientUnits="userSpaceOnUse"><stop stop-color="#EEF5DB"/><stop offset="1" stop-color="#C9E997"/></linearGradient>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="175%" color-interpolation-filters="sRGB"><feDropShadow dy="14" stdDeviation="14" flood-color="#292238" flood-opacity=".09"/><feDropShadow dy="2" stdDeviation="2" flood-color="#292238" flood-opacity=".04"/></filter>
    <g id="coffee" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h12v8a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9Z"/><path d="M17 10h1a3 3 0 1 1 0 6h-1M8 3v2M12 2v3M16 3v2"/></g>
    <g id="gift" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8H8a3 3 0 1 1 3-3l1 3Zm0 0h4a3 3 0 1 0-3-3l-1 3Z"/></g>
  </defs>
  <rect width="900" height="560" rx="24" fill="url(#surface)"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171A18">
    <text x="48" y="43" font-size="13" fill="#5B5E67">Your brand</text>
    <text x="516" y="43" font-size="13" fill="#5B5E67">Their Kardy wallet</text>
    <!-- Merchant colours and white stamp panels mirror Kardy's landing-page passes. -->
    <g transform="translate(84 230) rotate(6 168 94)" filter="url(#cardShadow)">
      <rect width="336" height="194" rx="22" fill="url(#lime)" stroke="#D7E3C6"/>
      <rect x="22" y="125" width="30" height="30" rx="9" fill="white"/>
      <text x="37" y="145" text-anchor="middle" font-size="17" font-weight="600">G</text>
      <text x="64" y="139" font-size="16" font-weight="600" letter-spacing="-.3">Good Company</text>
      <text x="64" y="159" font-size="12" fill="#47563E">A little something, just for you.</text>
    </g>
    <g transform="translate(46 88) rotate(-5 181 123)" filter="url(#cardShadow)">
      <rect width="362" height="246" rx="22" fill="url(#lavender)" stroke="#D6CDE9"/>
      <rect x="22" y="22" width="32" height="32" rx="10" fill="#6B42FF"/>
      <text x="38" y="44" text-anchor="middle" font-size="20" font-weight="600" fill="white">S</text>
      <text x="66" y="43" font-size="16" font-weight="600" letter-spacing="-.3">Sunday Coffee</text>
      <text x="23" y="89" font-size="27" font-weight="600" letter-spacing="-1">Your usual. On us.</text>
      <rect x="22" y="107" width="318" height="91" rx="14" fill="white"/>
      <g color="#6B42FF"><use href="#coffee" x="41" y="120"/><use href="#coffee" x="102" y="120"/><use href="#coffee" x="163" y="120"/><use href="#coffee" x="224" y="120"/></g>
      <g fill="none" stroke="#9B9EA6" stroke-width="1.2"><circle cx="297" cy="133" r="10"/><circle cx="53" cy="173" r="10"/><circle cx="114" cy="173" r="10"/><circle cx="175" cy="173" r="10"/><circle cx="236" cy="173" r="10"/></g>
      <use href="#gift" x="285" y="160" color="#6B42FF"/>
      <text x="23" y="224" font-size="12" fill="#50505E">4 / 10 stamps</text>
      <text x="339" y="224" text-anchor="end" font-size="15" font-weight="600" letter-spacing="-1">kardy</text>
    </g>
    <path d="M435 247h45m-6-6 6 6-6 6" fill="none" stroke="#8D829F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Browser chrome distinguishes the app from native Apple or Google Wallet. -->
    <g filter="url(#cardShadow)">
      <rect x="508" y="65" width="344" height="368" rx="22" fill="white" stroke="#DFE1DF"/>
      <path d="M508 106h344" fill="none" stroke="#ECEEEC"/>
      <g fill="#D9DCD9"><circle cx="529" cy="86" r="3"/><circle cx="540" cy="86" r="3"/><circle cx="551" cy="86" r="3"/></g>
      <text x="680" y="90" text-anchor="middle" font-size="11" fill="#686D69">Kardy · Browser wallet</text>
      <text x="530" y="138" font-size="19" font-weight="600" letter-spacing="-1.3">kardy</text>
      <text x="530" y="177" font-size="27" font-weight="600" letter-spacing="-1">Your cards.</text>
      <text x="530" y="198" font-size="12" fill="#5B5E67">Two memberships. One familiar place.</text>
      <rect x="530" y="218" width="300" height="76" rx="14" fill="#F0EAFF" stroke="#E5DCF7"/>
      <rect x="544" y="233" width="30" height="30" rx="9" fill="white"/>
      <text x="559" y="253" text-anchor="middle" font-size="17" font-weight="600" fill="#6B42FF">S</text>
      <text x="585" y="249" font-size="14" font-weight="600" letter-spacing="-.2">Sunday Coffee</text>
      <text x="585" y="273" font-size="12" fill="#5B5E67">4 / 10 stamps</text>
      <path d="m805 237 5 5-5 5" fill="none" stroke="#5B5E67" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="530" y="306" width="300" height="76" rx="14" fill="#EEF5E3" stroke="#E1EAD7"/>
      <rect x="544" y="321" width="30" height="30" rx="9" fill="white"/>
      <text x="559" y="341" text-anchor="middle" font-size="17" font-weight="600" fill="#405537">G</text>
      <text x="585" y="337" font-size="14" font-weight="600" letter-spacing="-.2">Good Company</text>
      <text x="585" y="361" font-size="12" fill="#5B5E67">2 / 8 stamps</text>
      <path d="m805 325 5 5-5 5" fill="none" stroke="#5B5E67" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m594 405 3 3 6-7" fill="none" stroke="#5B5E67" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="611" y="410" font-size="11" fill="#5B5E67">No app download needed</text>
    </g>
    <text x="48" y="472" font-size="12" fill="#5B5E67">Separate rewards. Separate progress. Kept together.</text>
    <text x="852" y="472" text-anchor="end" font-size="11" fill="#5B5E67">Illustrative memberships</text>
    <path d="M48 493h804" stroke="#DFE1E5"/>
    <text x="48" y="528" font-size="14" fill="#5B5E67">Native wallet support</text>
    <g transform="translate(293 510)" aria-hidden="true">
      <rect x="0.75" y="0.75" width="26.5" height="26.5" rx="7.25" fill="#171918" />
      <rect x="5.45" y="5.35" width="17.1" height="16.95" rx="4.15" fill="#F3F0EB" />
      <rect x="6.35" y="6.15" width="15.3" height="11.1" rx="3.2" fill="#39A9F5" />
      <rect x="6.35" y="8.6" width="15.3" height="10.9" rx="3.2" fill="#F9C928" />
      <rect x="6.35" y="11.05" width="15.3" height="10.2" rx="3.2" fill="#F36A5E" />
      <path d="M5.45 14.75h4.7c1.85 0 2.45 2.8 3.85 2.8s2-2.8 3.85-2.8h4.7v3.4a4.15 4.15 0 0 1-4.15 4.15H9.6a4.15 4.15 0 0 1-4.15-4.15v-3.4Z" fill="#F3F0EB" />
    </g>
    <text x="332" y="530" font-size="16" font-weight="600">Apple Wallet</text>
    <g transform="translate(501 510)" aria-hidden="true">
      <rect x="0.75" y="0.75" width="26.5" height="26.5" rx="7.25" fill="#F8F9FA" stroke="#D8DDE3" stroke-width="0.75" />
      <g transform="translate(4.17 5.5)">
        <path d="M0 3.792c0-2.094 1.707-3.792 3.812-3.792h12.037c2.105 0 3.812 1.698 3.812 3.792v6.938c0 2.095-1.707 3.792-3.812 3.792H3.812C1.707 14.522 0 12.825 0 10.73V3.792Z" fill="#00AF57" />
        <path d="M0 6.327c0-2.137 1.707-3.87 3.812-3.87h12.037c2.105 0 3.812 1.733 3.812 3.87v4.325c0 2.137-1.707 3.87-3.812 3.87H3.812C1.707 14.522 0 12.789 0 10.652V6.327Z" fill="#FEC700" />
        <path d="M0 8.724c0-2.104 1.709-3.81 3.816-3.81h12.029c2.108 0 3.816 1.706 3.816 3.81v1.988c0 2.104-1.708 3.81-3.816 3.81H3.816C1.709 14.522 0 12.816 0 10.712V8.724Z" fill="#FC413D" />
        <path d="m0 7.158 12.454 2.948a5.42 5.42 0 0 0 4.324-.897l2.883-2.173v6.325a3.6 3.6 0 0 1-3.622 3.583H3.664A3.63 3.63 0 0 1 0 13.36V7.158Z" fill="#3186FF" />
      </g>
    </g>
    <text x="540" y="530" font-size="16" font-weight="600">Google Wallet</text>
    <text x="852" y="528" text-anchor="end" font-size="12" fill="#5B5E67">When enabled</text>
  </g>
</svg>
