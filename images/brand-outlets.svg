<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">One brand, multiple outlets</title><desc id="desc">Sunday Coffee has Orchard, Joo Chiat, and Tiong Bahru outlets. Membership progress belongs to the brand, while recorded visits and redemptions can be attributed to an outlet. No real performance statistics are shown.</desc><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#DFDDEB"/></pattern></defs><rect width="800" height="360" rx="24" fill="#F8F8FC"/><rect width="800" height="360" rx="24" fill="url(#dots)"/><path d="M400 130V177M144 220V177H656V220M400 177V220" fill="none" stroke="#ff8fbe" stroke-width="2"/><g font-family="Inter,Arial,sans-serif"><rect x="245" y="30" width="310" height="102" rx="20" fill="#ca1c67"/><text x="270" y="72" fill="white" font-size="26" font-weight="600">Sunday Coffee</text><text x="270" y="105" fill="white" font-size="17">One brand. One programme.</text><g fill="white" stroke="#DFDDE7"><rect x="34" y="220" width="220" height="105" rx="18"/><rect x="290" y="220" width="220" height="105" rx="18"/><rect x="546" y="220" width="220" height="105" rx="18"/></g><g fill="#171A18" font-size="22" font-weight="600"><text x="57" y="260">Orchard</text><text x="313" y="260">Joo Chiat</text><text x="569" y="260">Tiong Bahru</text></g><g fill="#595866" font-size="16"><text x="57" y="295">Visits · Redemptions</text><text x="313" y="295">Visits · Redemptions</text><text x="569" y="295">Visits · Redemptions</text></g></g></svg>
