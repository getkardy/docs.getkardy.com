<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">One Kardy account, a role in each organisation</title>
  <desc id="desc">Illustrative account for Amelia Tan: Owner of Sunday Coffee, Manager at Forma Studio, and Staff at Good Company. Each outlet shows an illustrative manager and two staff members with initial avatars. These example outlet teams do not define access: permissions belong to the organisation.</desc>
